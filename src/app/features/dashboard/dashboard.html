<div class="min-h-screen bg-slate-50 text-slate-900">
    <div class="flex min-h-screen">
        <aside class="w-72 border-r border-slate-200 bg-white">
            <div class="px-6 py-4 border-b border-slate-200" style="height: 60px;">
                <div class="text-2xl font-semibold text-slate-900">RestoFlow</div>

            </div>

            <nav class="px-3 py-4 space-y-1">
                @for (item of menuItems; track item.route) {
                <a [routerLink]="item.route" routerLinkActive="bg-slate-100 text-slate-900"
                    class="group flex items-center gap-3 rounded-xl px-4 py-3 text-slate-600 transition hover:bg-slate-100 hover:text-slate-900">
                    <i [class]="item.icon + ' text-lg'"></i>
                    <span>{{ item.label | translate }}</span>
                </a>
                }
            </nav>
        </aside>

        <div class="flex-1">
            <header class="flex items-center justify-between border-b border-slate-200 bg-white px-6 py-4"
                style="height: 60px;">
                <div>

                </div>
                <div class="flex items-center gap-3">
                    <app-language-switcher />
                    <p-menu #menu [model]="items" [popup]="true" styleClass="w-40">
                        <ng-template #item let-item>
                            <a class=" p-menu-item-link">
                                <span [class]="item.icon"></span>
                                <span>{{ item.label | translate }}</span>
                            </a>
                        </ng-template>
                    </p-menu>
                    <button pButton severity="secondary" (click)="menu.toggle($event)">
                        <i class="pi pi-user"></i>
                        {{auth()?.username}}</button>
                </div>
            </header>

            <main class="p-6">
                <router-outlet />
            </main>
        </div>
    </div>
</div>
