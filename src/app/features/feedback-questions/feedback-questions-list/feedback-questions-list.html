@if (errorMessage()) {
    <div class="mb-4">
        <p-message severity="error">
            {{ errorMessage() }}
        </p-message>
    </div>
}

<app-data-table
    [table]="dt"
    (new)="navigateToNew()">

    <p-table
        #dt
        [value]="questions()"
        [loading]="loading()"
        [globalFilterFields]="['question']"
        [paginator]="tableConfig.paginator"
        [rows]="tableConfig.rows"
        [rowsPerPageOptions]="tableConfig.rowsPerPageOptions">

        <ng-template #header>
            <tr>
                <th pSortableColumn="question">
                    {{ 'feedbackQuestion' | translate }}
                    <p-sort-icon field="question" />
                </th>

                <th pSortableColumn="isActive">
                    {{ 'status' | translate }}
                    <p-sort-icon field="isActive" />
                </th>

                <th>
                    {{ 'actions' | translate }}
                </th>
            </tr>
        </ng-template>

        <ng-template #body let-question>
            <tr>
                <td>
                    {{ question.question }}
                </td>

                <td>
                    <p-tag
                        [value]="
                            question.isActive
                                ? ('active' | translate)
                                : ('inactive' | translate)
                        "
                        [severity]="question.isActive ? 'success' : 'danger'" />
                </td>

                <td>
                    <button
                        pButton
                        type="button"
                        severity="info"
                        text
                        size="small"
                        (click)="navigateToEdit(question.id)">

                        <svg data-p-icon="pencil"></svg>
                    </button>

                    <button
                        pButton
                        type="button"
                        severity="danger"
                        text
                        size="small"
                        (click)="deleteQuestion(question.id)">

                        <svg data-p-icon="trash"></svg>
                    </button>
                </td>
            </tr>
        </ng-template>

        <ng-template #emptymessage>
            <tr>
                <td colspan="3">
                    <div class="flex flex-col items-center justify-center gap-2 py-6">
                        <svg
                            data-p-icon="inbox"
                            class="w-8 h-8 text-slate-300">
                        </svg>

                        <span class="text-sm">
                            {{ 'noRecords' | translate }}
                        </span>
                    </div>
                </td>
            </tr>
        </ng-template>

    </p-table>
</app-data-table>
