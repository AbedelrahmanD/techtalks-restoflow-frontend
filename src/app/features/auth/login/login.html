<div class="relative flex min-h-screen flex-col items-center justify-center bg-slate-50 px-4 py-12">

    <div class="absolute top-6 right-6">
        <app-language-switcher />
    </div>

    <p-card [header]="'login' | translate"
        class="w-full max-w-sm border border-slate-200/60 bg-white shadow-md rounded-xl">

        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-5">

            <div class="flex flex-col gap-1.5">
                <label for="username">
                    {{ 'username' | translate }}
                </label>
                <p-iconfield>
                    <p-inputicon class="pi pi-user" />
                    <input pInputText id="username" formControlName="username" class="w-full"
                        [placeholder]="'username' | translate" />
                </p-iconfield>
            </div>

            <div class="flex flex-col gap-1.5">
                <label for="password">
                    {{ 'password' | translate }}
                </label>
                <p-iconfield>
                    <p-inputicon class="pi pi-lock" />
                    <input pInputPassword id="password" type="password" formControlName="password" class="w-full"
                        [placeholder]="'password' | translate" />
                </p-iconfield>
            </div>

            <button pButton type="submit" [disabled]="loginForm.invalid || isLoading()"
                styleClass="w-full mt-2 py-2.5 font-semibold tracking-wide">
                @if(isLoading()){
                <app-spinner />
                }@else{
                {{ 'submit' | translate}}
                }
            </button>

            @if (errorMessage()) {
            <div class="mt-1">
                <p-message severity="error" icon="pi pi-exclamation-triangle" [closable]="true">
                    {{errorMessage()}}
                </p-message>
            </div>
            }
        </form>
    </p-card>
</div>
